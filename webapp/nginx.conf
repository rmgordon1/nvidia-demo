server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;
    index index.html;

    # Fully self-contained: no external fonts, scripts or APIs.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch fresh app code so updates show without a hard refresh.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # ITSM RAG server. ${API_UPSTREAM} is filled in at container start (nginx image templates):
    # host.docker.internal:8030 when the server runs on the host (../itsm-rag-server/run.sh), rag:8030 under
    # the top-level docker-compose.yml. The UI calls /api/* when js/ai/config.js MODE = "api".
    # Buffering off so copilot chat streams token by token.
    location /api/ {
        proxy_pass http://${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 8m;
    }
}
